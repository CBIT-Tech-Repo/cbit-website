# Publishes the `staging` branch to GitHub Pages, served at https://staging.cbitx.com
# (one CNAME at GoDaddy; the custom domain is set in the repository's Pages settings).
# Same build and guards as the Checks workflow, so staging shows exactly what main would ship.
# GitHub Pages cannot send response headers, so noindex comes from the page's robots meta tag:
# PUBLIC_NOINDEX stays true here (the layout's default) until launch day.
name: Deploy staging

# Manual only from 15 October 2026: this repository's one GitHub Pages site now serves production
# (deploy-production.yml, from main). staging.cbitx.com is served by CBIT-Tech-Repo/cbit-design-review.
# Running this by hand would replace the live site with the staging branch, so do it only on purpose.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PUBLIC_SITE_URL: https://staging.cbitx.com
      PUBLIC_NOINDEX: 'true'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: deploy
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
